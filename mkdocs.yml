site_name: opencode-devcontainers
site_description: OpenCode plugin for isolated branch workspaces using devcontainers
site_url: https://timlaing.github.io/opencode-devcontainers/
repo_url: https://github.com/timlaing/opencode-devcontainers
repo_name: timlaing/opencode-devcontainers
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Configuration: configuration.md
  - Migrating to OpenCode V2: migration.md
  - Development: development.md
