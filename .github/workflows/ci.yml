name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Plugin tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Configure git for tests
        run: |
          git config --global user.email "ci@test.local"
          git config --global user.name "CI Test"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          sudo npm install -g @devcontainers/cli

      - name: Install Node.js dependencies
        run: npm ci

      # The combined entrypoint must import cleanly and expose the exact shape
      # OpenCode V2's loader requires (default export with id + setup) alongside
      # the V1 server() entrypoint. Deeper behavior is covered by the suites.
      - name: Verify combined V1/V2 entrypoint shape
        run: |
          node --input-type=module -e '
          import { pathToFileURL } from "node:url"
          const mod = await import(pathToFileURL(process.cwd() + "/plugin/index.js"))
          const def = mod.default
          const shape = {
            id: typeof def?.id,
            setup: typeof def?.setup,
            server: typeof def?.server,
            namedServer: typeof mod.devcontainers,
          }
          if (shape.id !== "string" || shape.setup !== "function" || shape.server !== "function" || shape.namedServer !== "function") {
            throw new Error("entrypoint shape invalid: " + JSON.stringify(shape))
          }
          console.log("OK: V2 definition id=" + def.id + " with setup() and V1 server()")
          '

      - name: Run tests
        run: npm test

  release:
    name: Release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # semantic-release needs to push tags, create the GitHub release and
    # publish to GitHub Packages; the test job stays read-only.
    permissions:
      contents: write
      packages: write  # Publish to the GitHub Packages npm registry
      issues: write    # For semantic-release failure reporting
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      # persist-credentials stays enabled here: semantic-release pushes the
      # release tag with the workflow token embedded in the remote URL.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # registry-url points npm at GitHub Packages and writes an .npmrc auth
      # line keyed on NODE_AUTH_TOKEN. Dependency installs are unaffected:
      # the lockfile pins resolved URLs on registry.npmjs.org.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://npm.pkg.github.com'

      - name: Install Node.js dependencies
        run: npm ci

      # Runs unmasked: a failed publish must fail the job (a previous
      # set +e wrapper swallowed semantic-release exit code 1 and hid a
      # broken release).
      - name: Run semantic-release
        id: semantic
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
