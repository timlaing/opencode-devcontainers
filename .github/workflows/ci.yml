name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel in-flight runs on main: a cancelled release job could leave
# a published package without its tag/GitHub release. PR runs still cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Plugin tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Configure git for tests
        run: |
          git config --global user.email "ci@test.local"
          git config --global user.name "CI Test"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          sudo npm install -g @devcontainers/cli

      - name: Install Node.js dependencies
        run: npm ci

      # The combined entrypoint must import cleanly and expose the exact shape
      # OpenCode V2's loader requires (default export with id + setup) alongside
      # the V1 server() entrypoint. Deeper behavior is covered by the suites.
      - name: Verify combined V1/V2 entrypoint shape
        run: |
          node --input-type=module -e '
          import { pathToFileURL } from "node:url"
          const mod = await import(pathToFileURL(process.cwd() + "/plugin/index.js"))
          const def = mod.default
          const shape = {
            id: typeof def?.id,
            setup: typeof def?.setup,
            server: typeof def?.server,
            namedServer: typeof mod.devcontainers,
          }
          if (shape.id !== "string" || shape.setup !== "function" || shape.server !== "function" || shape.namedServer !== "function") {
            throw new Error("entrypoint shape invalid: " + JSON.stringify(shape))
          }
          console.log("OK: V2 definition id=" + def.id + " with setup() and V1 server()")
          '

      - name: Run tests
        run: npm test

  release:
    name: Release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # semantic-release pushes tags, creates the GitHub release, publishes the
    # canonical version to npmjs via trusted publishing (OIDC + provenance),
    # and the follow-up step mirrors it to GitHub Packages. No npm token
    # secret exists in this job. The test job stays read-only.
    permissions:
      contents: write
      id-token: write   # OIDC for npmjs provenance attestation
      packages: write   # Publish to the GitHub Packages npm registry
      issues: write     # For semantic-release failure reporting
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      # persist-credentials is off so no token sits in .git/config while
      # `npm ci` runs dependency lifecycle scripts; the release step points
      # origin at GITHUB_TOKEN only after installs are done.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No registry-url here, deliberately: setup-node would write an
      # .npmrc auth line keyed on NODE_AUTH_TOKEN, and npm skips its native
      # OIDC (trusted publishing) exchange whenever a token auth path exists.
      # Installs are unaffected — the lockfile pins resolved URLs on
      # registry.npmjs.org, which is also the default registry.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      # npm trusted publishing (OIDC) requires npm >= 11.5.1; the runner's
      # bundled npm with Node 22 is older, so pin a known-good major.
      - name: Pin npm for trusted publishing support
        run: npm install -g npm@^11.5.1

      - name: Install Node.js dependencies
        run: npm ci

      # Runs unmasked: a failed publish must fail the job (a previous
      # set +e wrapper swallowed semantic-release exit code 1 and hid a
      # broken release). npm run executes the exact devDependency version
      # installed by `npm ci` from the lockfile — no on-demand install.
      #
      # Canonical publish: npmjs via trusted publishing (OIDC). No npm token
      # exists anywhere in this workflow: id-token: write lets the npm CLI
      # exchange a short-lived OIDC token for publish credentials, validated
      # against the trusted publisher configured on npmjs.com for this repo
      # and this exact workflow filename (ci.yml). Setting any NPM_TOKEN /
      # NODE_AUTH_TOKEN here would suppress OIDC and fail the publish.
      - name: Run semantic-release
        id: semantic
        # Re-inject push credentials now that installs are finished:
        # semantic-release pushes the release tag through origin's URL.
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          npm run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Mirror the released version to GitHub Packages. semantic-release's
      # prepare step already stamped the checked-out package.json with the
      # release version, so this publishes an identical artifact. Authenticated
      # with GITHUB_TOKEN (packages: write); no provenance, since npm allows
      # only one provenance source per version.
      - name: Mirror release to GitHub Packages
        if: steps.semantic.outputs.new_release_published == 'true'
        run: npm run publish:gh-packages -- --publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
