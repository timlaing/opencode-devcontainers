name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Publishing is event-driven: the Publish release job below runs only when
  # a GitHub Release is published (Releases UI or `gh release create`), never
  # on pushes to main.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel in-flight runs on main: a cancelled release job could leave
# a published package without its tag/GitHub release. PR runs still cancel.
# The event name is part of the group because GitHub allows only one pending
# run per group: a workflow_dispatch run on main would otherwise replace a
# pending push run, whose release job the dispatch run then skips —
# stranding that push's release until the next push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Plugin tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Configure git for tests
        run: |
          git config --global user.email "ci@test.local"
          git config --global user.name "CI Test"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          sudo npm install -g @devcontainers/cli

      - name: Install Node.js dependencies
        run: npm ci

      # The combined entrypoint must import cleanly and expose the exact shape
      # OpenCode V2's loader requires (default export with id + setup) alongside
      # the V1 server() entrypoint. Deeper behavior is covered by the suites.
      - name: Verify combined V1/V2 entrypoint shape
        run: |
          node --input-type=module -e '
          import { pathToFileURL } from "node:url"
          const mod = await import(pathToFileURL(process.cwd() + "/plugin/index.js"))
          const def = mod.default
          const shape = {
            id: typeof def?.id,
            setup: typeof def?.setup,
            server: typeof def?.server,
            namedServer: typeof mod.devcontainers,
          }
          if (shape.id !== "string" || shape.setup !== "function" || shape.server !== "function" || shape.namedServer !== "function") {
            throw new Error("entrypoint shape invalid: " + JSON.stringify(shape))
          }
          console.log("OK: V2 definition id=" + def.id + " with setup() and V1 server()")
          '

      - name: Run tests
        run: npm test

  publish:
    name: Publish release
    # Event-driven, never push-driven: this job runs only when a GitHub
    # Release is published for this repository (the Releases UI or
    # `gh release create vX.Y.Z --target main`, which creates the release
    # tag as a side effect). A push to main never publishes anything.
    # Prereleases are skipped — stable vX.Y.Z releases are the channel.
    if: github.event_name == 'release' && github.event.action == 'published' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # OIDC for npmjs trusted publishing (and provenance)
      packages: write   # Publish to the GitHub Packages npm registry
    steps:
      # On release events actions/checkout defaults to the release tag, so
      # the published artifact matches the tagged commit exactly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No registry-url here, deliberately: setup-node would write an
      # .npmrc auth line keyed on NODE_AUTH_TOKEN, and npm skips its native
      # OIDC (trusted publishing) exchange whenever a token auth path exists.
      # Installs are unaffected — the lockfile pins resolved URLs on
      # registry.npmjs.org, which is also the default registry.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      # npm trusted publishing (OIDC) requires npm >= 11.5.1; the runner's
      # bundled npm with Node 22 is older. Exact pin keeps the release
      # deterministic; --ignore-scripts blocks lifecycle scripts.
      - name: Pin npm for trusted publishing support
        run: npm install -g npm@11.21.1 --ignore-scripts

      - name: Install Node.js dependencies
        run: npm ci

      # package.json commits a placeholder version; the release tag is the
      # source of truth for what to publish. Stamp the released version into
      # this checkout (never committed) so both publishes carry it, and
      # refuse non-stable tags — only vX.Y.Z releases publish.
      - name: Stamp the released version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "release tag '$GITHUB_REF_NAME' is not a stable vX.Y.Z tag; refusing to publish" >&2
            exit 1
          fi
          npm pkg set version="$version"
          echo "Publishing ${GITHUB_REPOSITORY}@${version}"

      # Canonical publish: npmjs via trusted publishing (OIDC) with
      # provenance. No npm token exists anywhere in this workflow —
      # id-token: write lets the npm CLI exchange a short-lived OIDC token
      # for publish credentials, validated against the trusted publisher
      # configured on npmjs.com for this repo and this exact workflow
      # filename (ci.yml). Any NPM_TOKEN / NODE_AUTH_TOKEN env here would
      # suppress OIDC and fail the publish. Idempotent: re-running this job
      # finds the version already on npmjs and skips instead of failing.
      - name: Publish to npmjs (canonical)
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "@${GITHUB_REPOSITORY}@${version}" version > /dev/null 2>&1; then
            echo "${version} is already on npmjs; nothing to publish"
          else
            npm publish --provenance --access public
          fi

      # Mirror the same version to GitHub Packages with the job's own
      # GITHUB_TOKEN (packages: write) — no provenance, since npm allows
      # only one provenance source per version. The script skips cleanly
      # when the version is already mirrored (re-run idempotency) and fails
      # loudly when no token is present.
      - name: Mirror to GitHub Packages
        run: npm run publish:gh-packages -- --publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
