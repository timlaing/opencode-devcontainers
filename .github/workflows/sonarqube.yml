name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require SonarQube credentials
        if: env.SONAR_TOKEN == ''
        run: exit 1

      - name: SonarQube Scan (branch)
        if: github.event_name != 'pull_request'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: >-
            -Dsonar.projectKey=timlaing_opencode-devcontainers
            -Dsonar.organization=timlaing
            -Dsonar.projectName=opencode-devcontainers
            -Dsonar.sources=plugin,install.sh,.releaserc.cjs,.devcontainer,.github/workflows
            -Dsonar.tests=test
            -Dsonar.qualitygate.wait=true

      - name: SonarQube Scan (pull request)
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: >-
            -Dsonar.projectKey=timlaing_opencode-devcontainers
            -Dsonar.organization=timlaing
            -Dsonar.projectName=opencode-devcontainers
            -Dsonar.sources=plugin,install.sh,.releaserc.cjs,.devcontainer,.github/workflows
            -Dsonar.tests=test
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}
            -Dsonar.pullrequest.provider=github
            -Dsonar.pullrequest.github.repository=${{ github.repository }}
            -Dsonar.qualitygate.wait=true
