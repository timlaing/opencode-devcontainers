name: Dependency audit

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-audit.yml
  # Every PR runs the audit so the check always registers; a paths filter
  # here would leave PRs that don't touch the lockfile waiting on a check
  # that never runs.
  pull_request:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm:
    name: npm dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      # Scope to runtime dependencies: only @opencode-ai/plugin ships to
      # users. The semantic-release dev tree carries advisories whose only
      # fixes are breaking downgrades, so auditing it would leave this check
      # permanently red.
      - run: npm audit --omit=dev
